<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Bảo Trì Nâng Cấp - Hỗ Trợ Garena Dev TanPhat</title>
    <meta name="description" content="Hệ thống Hỗ Trợ Garena (dichvuchange.site) đang được bảo trì và nâng cấp. Dự kiến hoàn thành trong 2 ngày. Mong quý khách thông cảm!">
    <meta name="author" content="Dev TanPhat">
    <meta name="robots" content="noindex, nofollow"> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scanline-effect"></div>

    <div class="maintenance-container" id="maintenance-container">
        
        <div class="maintenance-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.83-5.83M11.42 15.17l-4.25-4.25a2.652 2.652 0 0 1 0-3.75l4.25-4.25a2.652 2.652 0 0 1 3.75 0l4.25 4.25a2.652 2.652 0 0 1 0 3.75l-4.25 4.25a2.652 2.652 0 0 1-3.75 0Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 7.17 19.42l-4.25-4.25a1.5 1.5 0 0 1 0-2.12l4.25-4.25a1.5 1.5 0 0 1 2.12 0l4.25 4.25" />
            </svg>
        </div>

        <h1>Hệ Thống Đang Nâng Cấp</h1>
        <p class="subtitle">Dịch vụ Hỗ Trợ Garena - Dev TanPhat đang được bảo trì để nâng cấp Database và Tốc độ.
            Mong quý khách thông cảm và quay lại sau.</p>
        
        <div class="countdown-timer" id="countdown">
            <div class="time-block">
                <span id="days">00</span>
                <label>Ngày</label>
            </div>
            <div class="time-block">
                <span id="hours">00</span>
                <label>Giờ</label>
            </div>
            <div class="time-block">
                <span id="minutes">00</span>
                <label>Phút</label>
            </div>
            <div class="time-block">
                <span id="seconds">00</span>
                <label>Giây</label>
            </div>
        </div>

        <p class="brand-footer">© 2025 Dev TanPhat</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
